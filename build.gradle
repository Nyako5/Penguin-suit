import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

plugins {
    id 'fabric-loom' version '1.17.21'
    id 'java'
}
group = 'dev.penguinsuit'
version = project.mod_version
base { archivesName = 'penguin-suit' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }

// 26.2 uses unobfuscated names. The empty mapping preserves those names.
def mappingsStub = file('.gradle/mappings-stub.jar')
mappingsStub.parentFile.mkdirs()
new ZipOutputStream(new FileOutputStream(mappingsStub)).withCloseable { zip ->
    zip.putNextEntry(new ZipEntry('mappings/mappings.tiny'))
    zip.write('tiny\t2\t0\tofficial\tintermediary\tnamed\n'.getBytes('UTF-8'))
    zip.closeEntry()
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    mappings files(mappingsStub)
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.157.0+26.2'
    implementation 'net.fabricmc:fabric-language-kotlin:1.13.13+kotlin.2.4.10'
    compileOnly files('libs/penguin-server-fabric-1.1.7-mc26.2.jar', 'libs/chat-remastered-fabric-0.5.1+26.2.jar')
    runtimeOnly files('libs/penguin-server-fabric-1.1.7-mc26.2.jar', 'libs/chat-remastered-fabric-0.5.1+26.2.jar')
    if (file('libs/cloth-config-26.2.155.jar').exists()) runtimeOnly files('libs/cloth-config-26.2.155.jar')
    include implementation('io.github.llamalad7:mixinextras-fabric:0.5.5')
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    runtimeOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(Jar).configureEach {
    from('LICENSE')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'; options.release = 25
    // All targets use published, unobfuscated 26.2 names with remap=false.
    options.compilerArgs += ['-proc:none']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.register('exportDefaultConfig', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.penguinsuit.config.BridgeConfig'
    args file('examples/penguin-suit.jsonc').absolutePath
}

tasks.register('verifyUpstream') {
    doLast {
        def expected = [
            'penguin-server-fabric-1.1.7-mc26.2.jar': ['SHA-256', '00b425fff87bda7414722fc9f2e1a7816d4393c4f965f26cac76c0a045cf8088'],
            'chat-remastered-fabric-0.5.1+26.2.jar': ['SHA-512', '45151ce33a511ab9fd2f3209b6628088e323cf3142da861ce4d02e16f4a16747ddf9242e6e3fafec40a72cf73a20b6a6d3afd067b34c2ec6a33cc9ec2255d55a']
        ]
        expected.each { name, spec ->
            def f = file('libs/' + name)
            if (!f.isFile()) throw new GradleException('Missing upstream JAR: ' + f)
            def digest = java.security.MessageDigest.getInstance(spec[0]).digest(f.bytes).encodeHex().toString()
            if (digest != spec[1]) throw new GradleException('Unverified upstream JAR: ' + name)
        }
    }
}
compileJava.dependsOn verifyUpstream
